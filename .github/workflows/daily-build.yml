name: ⏰ Daily Build & Regression Check

on:
  schedule:
    # Runs automatically every morning at 6:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  # Reuse the exact same quality gate as ci.yml instead of a hand-maintained
  # copy that can silently drift out of sync.
  quality-gate:
    name: 🩺 Daily Regression & System Health
    uses: ./.github/workflows/ci.yml

  report:
    name: 🔔 Log Daily Build Result
    needs: quality-gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [ "${{ needs.quality-gate.result }}" = "success" ]; then
            echo "✅ Daily Build and Regression Check passed on $(date -u)"
          else
            echo "❌ Daily Build and Regression Check FAILED (${{ needs.quality-gate.result }}) on $(date -u)"
            exit 1
          fi
